name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bruma .
      - name: Smoke test del contenedor
        run: |
          docker run -d -p 8077:8077 --name bruma bruma
          for i in $(seq 1 30); do curl -fs localhost:8077/healthz && break; sleep 2; done
          curl -fs "localhost:8077/api/forecast?station=29509&date=2024-03-04" > /dev/null
